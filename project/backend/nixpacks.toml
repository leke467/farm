[phases.setup]
nixPkgs = ["postgresql"]

[phases.build]
cmds = [
    "python manage.py collectstatic --noinput"
]

[start]
cmd = "sh -c \"python manage.py migrate --noinput && (python create_superuser.py || true) && gunicorn terra_track.wsgi --bind 0.0.0.0:${PORT:-8000} --workers 2 --threads 4 --timeout 120\""
