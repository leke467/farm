[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "postgresql"]

[phases.install]
cmds = ["pip install --upgrade pip", "pip install -r requirements.txt"]

[phases.build]
cmds = ["python project/backend/manage.py collectstatic --noinput || true"]

[start]
cmd = "sh -c \"cd project/backend && python manage.py migrate --noinput && (python create_superuser.py || true) && (python seed_demo_account.py || true) && gunicorn terra_track.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2 --threads 4 --timeout 120\""
